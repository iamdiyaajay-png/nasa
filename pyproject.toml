[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhnmisntra-science"
version = "0.1.0"
description = "Bhramanashthra Scientific Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

